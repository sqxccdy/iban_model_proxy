<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iBan Model Proxy Monitor</title>
  <style>
    :root {
      --bg: #f4efe6;
      --panel: rgba(255, 251, 244, 0.88);
      --panel-strong: #fffaf0;
      --line: rgba(59, 43, 24, 0.12);
      --text: #2f2418;
      --muted: #756554;
      --accent: #a54b27;
      --accent-soft: rgba(165, 75, 39, 0.12);
      --good: #236a4b;
      --bad: #a33434;
      --shadow: 0 24px 60px rgba(74, 50, 24, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 214, 170, 0.65), transparent 34%),
        radial-gradient(circle at top right, rgba(201, 124, 68, 0.22), transparent 28%),
        linear-gradient(180deg, #fbf6ee 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 40px;
    }

    .hero {
      display: grid;
      gap: 20px;
      grid-template-columns: 1.4fr 0.9fr;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .hero-card,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .hero-card {
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      inset: auto -60px -60px auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(165, 75, 39, 0.18), transparent 70%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 10px;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 0.96;
      letter-spacing: -0.04em;
    }

    .subtext {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .status-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .status-label {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      background: rgba(35, 106, 75, 0.12);
      color: var(--good);
    }

    .status-pill.offline {
      background: rgba(163, 52, 52, 0.12);
      color: var(--bad);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.65);
    }

    .big-number {
      font-size: 54px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .muted {
      color: var(--muted);
    }

    .cards {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 24px;
    }

    .card {
      padding: 20px;
      min-height: 148px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h2,
    .panel h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-value {
      font-size: 40px;
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 700;
      margin-top: 14px;
    }

    .card-footer {
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
    }

    .panel {
      padding: 20px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      margin-bottom: 16px;
    }

    .panel-copy {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(47, 36, 24, 0.08);
      font-size: 12px;
      font-weight: 700;
    }

    .mono {
      font-family: "SFMono-Regular", "Menlo", "Consolas", monospace;
      font-size: 12px;
    }

    .event-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 14px;
      max-height: 920px;
      overflow: auto;
    }

    .connection-layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 16px;
    }

    .connection-filter {
      min-width: 0;
      padding-right: 16px;
      border-right: 1px solid var(--line);
    }

    .filter-heading {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .connection-filter-list {
      display: grid;
      gap: 6px;
      max-height: 920px;
      overflow: auto;
    }

    .connection-filter-button {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      text-align: left;
    }

    .connection-filter-button:hover,
    .connection-filter-button.active {
      border-color: var(--line);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .connection-filter-id {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .connection-filter-status {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      appearance: none;
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 10px 12px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
    }

    .tab:hover,
    .tab[aria-selected="true"] {
      color: var(--accent);
    }

    .tab[aria-selected="true"] {
      border-bottom-color: var(--accent);
    }

    .tab-panel[hidden] {
      display: none;
    }

    .event-item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.52);
    }

    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .event-title {
      font-weight: 700;
      font-size: 14px;
    }

    .event-time {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .event-body {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }

    .event-summary {
      margin-bottom: 10px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }

    .event-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      margin-bottom: 10px;
    }

    .event-detail {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(47, 36, 24, 0.04);
      border: 1px solid rgba(47, 36, 24, 0.08);
    }

    .event-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .event-value {
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .event-raw {
      margin-top: 10px;
      padding: 12px;
      border-radius: 14px;
      background: #2b2118;
      color: #f7efe3;
      font-family: "SFMono-Regular", "Menlo", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 1080px) {
      .hero,
      .grid {
        grid-template-columns: 1fr;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .event-detail-grid {
        grid-template-columns: 1fr;
      }

      .connection-layout {
        grid-template-columns: 1fr;
      }

      .connection-filter {
        padding: 0 0 12px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .connection-filter-list {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        max-height: 220px;
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 20px 14px 28px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .hero-card,
      .panel,
      .status-card {
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="hero-card">
        <div class="eyebrow">Realtime SSE Monitor</div>
        <h1>连接监控<br>一眼看清</h1>
        <p class="subtext">
          这个页面会直接订阅 <span class="mono">/events</span>，实时更新错误、成功失败次数和 token 统计。
          页面刷新后会重新建立订阅，不依赖额外接口。
        </p>
      </div>
      <div class="hero-card status-card">
        <div class="status-row">
          <div>
            <div class="status-label">Event Stream</div>
            <div id="connectionStatus" class="status-pill offline">
              <span class="status-dot"></span>
              <span>Connecting</span>
            </div>
          </div>
          <div class="muted" id="lastEventTime">尚未收到事件</div>
        </div>
        <div>
          <div class="status-label">代理错误数</div>
          <div class="big-number" id="errorCount">0</div>
        </div>
      </div>
    </section>

    <section class="cards">
      <article class="panel card">
        <div>
          <h2>成功次数</h2>
          <div class="card-value" id="successCount">0</div>
        </div>
        <div class="card-footer">来自最新的 <span class="mono">stats_update</span></div>
      </article>
      <article class="panel card">
        <div>
          <h2>失败次数</h2>
          <div class="card-value" id="failCount">0</div>
        </div>
        <div class="card-footer">非 200 或代理内部错误都会累计</div>
      </article>
      <article class="panel card">
        <div>
          <h2>Total Tokens</h2>
          <div class="card-value" id="tokenCount">0</div>
        </div>
        <div class="card-footer">按服务端月度统计自动累计</div>
      </article>
      <article class="panel card">
        <div>
          <h2>最近连接</h2>
          <div class="card-value" id="connectionCount">0</div>
        </div>
        <div class="card-footer">页面内保留最近 50 个连接</div>
      </article>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-head">
          <div>
            <h2>实时事件</h2>
            <div class="panel-copy">连接会按 <span class="mono">conn_id</span> 自动合并打开和关闭事件；统计更新独立保存。</div>
          </div>
        </div>
        <div class="tabs" role="tablist" aria-label="事件分类">
          <button id="connectionsTab" class="tab" type="button" role="tab" aria-selected="true" aria-controls="connectionsPanel">连接</button>
          <button id="statsTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="statsPanel">统计更新</button>
        </div>
        <div id="connectionsPanel" class="tab-panel" role="tabpanel" aria-labelledby="connectionsTab">
          <div class="connection-layout">
            <aside class="connection-filter" aria-label="按连接筛选">
              <div class="filter-heading">Conn ID</div>
              <div id="connectionFilterList" class="connection-filter-list"></div>
            </aside>
            <ul id="connectionList" class="event-list"></ul>
          </div>
        </div>
        <div id="statsPanel" class="tab-panel" role="tabpanel" aria-labelledby="statsTab" hidden>
          <ul id="statsList" class="event-list"></ul>
        </div>
      </article>
    </section>
  </div>

  <script>
    const state = {
      connections: new Map(),
      selectedConnId: null,
      statsEvents: [],
      stats: {
        successCount: 0,
        failCount: 0,
        totalTokens: 0
      },
      errorCount: 0
    };

    const nodes = {
      connectionStatus: document.getElementById("connectionStatus"),
      lastEventTime: document.getElementById("lastEventTime"),
      errorCount: document.getElementById("errorCount"),
      successCount: document.getElementById("successCount"),
      failCount: document.getElementById("failCount"),
      tokenCount: document.getElementById("tokenCount"),
      connectionCount: document.getElementById("connectionCount"),
      connectionsTab: document.getElementById("connectionsTab"),
      statsTab: document.getElementById("statsTab"),
      connectionsPanel: document.getElementById("connectionsPanel"),
      statsPanel: document.getElementById("statsPanel"),
      connectionFilterList: document.getElementById("connectionFilterList"),
      connectionList: document.getElementById("connectionList"),
      statsList: document.getElementById("statsList")
    };

    function formatTime(ts) {
      if (!ts) {
        return "-";
      }
      return new Date(ts).toLocaleString("zh-CN", {
        hour12: false
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatJson(value) {
      if (value == null) {
        return "";
      }
      return JSON.stringify(value, null, 2);
    }

    function setConnectionStatus(connected, label) {
      nodes.connectionStatus.classList.toggle("offline", !connected);
      nodes.connectionStatus.lastElementChild.textContent = label;
    }

    function updateConnection(payload) {
      const connection = state.connections.get(payload.conn_id) || { connId: payload.conn_id };
      if (payload.type === "conn_open") {
        connection.open = payload;
      } else {
        connection.close = payload;
      }
      state.connections.set(payload.conn_id, connection);

      while (state.connections.size > 50) {
        const oldest = [...state.connections.entries()]
          .sort(([, a], [, b]) => (a.open?.ts || a.close?.ts || 0) - (b.open?.ts || b.close?.ts || 0))[0];
        state.connections.delete(oldest[0]);
        if (state.selectedConnId === oldest[0]) {
          state.selectedConnId = null;
        }
      }
      nodes.connectionCount.textContent = String(state.connections.size);
    }

    function pushStatsEvent(item) {
      state.statsEvents.unshift(item);
      state.statsEvents = state.statsEvents.slice(0, 50);
    }

    function updateLastEventTime(ts) {
      nodes.lastEventTime.textContent = ts ? "最近事件 " + formatTime(ts) : "尚未收到事件";
    }

    function renderStats() {
      nodes.errorCount.textContent = String(state.errorCount);
      nodes.successCount.textContent = String(state.stats.successCount);
      nodes.failCount.textContent = String(state.stats.failCount);
      nodes.tokenCount.textContent = String(state.stats.totalTokens);
    }

    function renderEventDetails(details) {
      if (!details || !details.length) {
        return "";
      }

      return `
        <div class="event-detail-grid">
          ${details.map((item) => `
            <div class="event-detail">
              <div class="event-label">${escapeHtml(item.label)}</div>
              <div class="event-value">${escapeHtml(item.value ?? "-")}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderList(node, items, emptyText) {
      if (!items.length) {
        node.innerHTML = `<li class="empty">${emptyText}</li>`;
        return;
      }

      node.innerHTML = items.map((item) => `
        <li class="event-item">
          <div class="event-top">
            <div class="event-title">${escapeHtml(item.title)}</div>
            <div class="event-time">${escapeHtml(formatTime(item.ts))}</div>
          </div>
          <div class="event-summary">${escapeHtml(item.summary)}</div>
          ${renderEventDetails(item.details)}
          ${item.raw ? `<pre class="event-raw">${escapeHtml(item.raw)}</pre>` : ""}
        </li>
      `).join("");
    }

    function connectionToEvents(connection) {
      const open = connection.open;
      const close = connection.close;
      const events = [];

      if (open) {
        events.push({
          title: "连接打开",
          ts: open.ts,
          summary: `${open.path} 收到一个新请求`,
          details: [
            { label: "Conn ID", value: connection.connId },
            { label: "Remote", value: open.remote || "-" },
            { label: "Model", value: open.request_info?.model || "-" }
          ],
          raw: formatJson(open.request_info)
        });
      }

      if (close) {
        const hasError = Boolean(close.error);
        events.push({
          title: hasError ? "连接关闭（错误）" : "连接关闭",
          ts: close.ts,
          summary: close.error || `${close.path} 已结束`,
          details: [
            { label: "Conn ID", value: connection.connId },
            { label: "Remote", value: close.remote || open?.remote || "-" },
            { label: "Status", value: close.status },
            { label: "Cost", value: `${close.cost_ms}ms` }
          ].concat(hasError ? [
            { label: "Stage", value: close.stage || "-" },
            { label: "Upstream", value: close.upstream_path || "-" }
          ] : []),
          raw: close.response_preview || ""
        });
      }

      return events;
    }

    function renderConnections() {
      const connections = [...state.connections.values()]
        .sort((a, b) => (b.open?.ts || b.close?.ts || 0) - (a.open?.ts || a.close?.ts || 0));
      nodes.connectionFilterList.innerHTML = [
        `<button class="connection-filter-button ${state.selectedConnId === null ? "active" : ""}" type="button" data-conn-id="">全部连接</button>`,
        ...connections.map((connection) => {
          const active = state.selectedConnId === connection.connId;
          const status = connection.close ? (connection.close.error ? "关闭：错误" : "已关闭") : "处理中";
          return `<button class="connection-filter-button ${active ? "active" : ""}" type="button" data-conn-id="${escapeHtml(connection.connId)}" title="${escapeHtml(connection.connId)}">
            <span class="connection-filter-id mono">${escapeHtml(connection.connId)}</span>
            <span class="connection-filter-status">${escapeHtml(status)}</span>
          </button>`;
        })
      ].join("");

      const visibleConnections = state.selectedConnId === null
        ? connections
        : connections.filter((connection) => connection.connId === state.selectedConnId);
      const events = visibleConnections
        .flatMap(connectionToEvents)
        .sort((a, b) => (b.ts || 0) - (a.ts || 0));
      renderList(nodes.connectionList, events, state.selectedConnId ? "未找到该连接" : "正在等待连接事件...");
    }

    function renderStatsEvents() {
      renderList(nodes.statsList, state.statsEvents, "正在等待统计更新...");
    }

    function renderAll() {
      renderStats();
      renderConnections();
      renderStatsEvents();
    }

    function handleEvent(payload) {
      if (!payload || !payload.type) {
        return;
      }

      updateLastEventTime(payload.ts);

      if (payload.type === "conn_open") {
        updateConnection(payload);
      }

      if (payload.type === "conn_close") {
        if (payload.error) {
          state.errorCount += 1;
        }
        updateConnection(payload);
      }

      if (payload.type === "stats_update") {
        state.stats.successCount = payload.success_count ?? 0;
        state.stats.failCount = payload.fail_count ?? 0;
        state.stats.totalTokens = payload.total_tokens ?? 0;
        pushStatsEvent({
          title: "统计更新",
          ts: payload.ts,
          summary: "服务端统计数据已刷新",
          details: [
            { label: "Success", value: state.stats.successCount },
            { label: "Fail", value: state.stats.failCount },
            { label: "Tokens", value: state.stats.totalTokens }
          ]
        });
      }

      renderAll();
    }

    function showTab(name) {
      const showConnections = name === "connections";
      nodes.connectionsTab.setAttribute("aria-selected", String(showConnections));
      nodes.statsTab.setAttribute("aria-selected", String(!showConnections));
      nodes.connectionsPanel.hidden = !showConnections;
      nodes.statsPanel.hidden = showConnections;
    }

    function startEventStream() {
      setConnectionStatus(false, "Connecting");
      const source = new EventSource("/events");

      source.onopen = () => {
        setConnectionStatus(true, "Connected");
      };

      source.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          handleEvent(payload);
        } catch (error) {
          pushStatsEvent({
            title: "解析失败",
            ts: Date.now(),
            summary: "收到了一条无法解析的事件数据",
            details: [
              { label: "Reason", value: error.message || "Unknown parse error" }
            ]
          });
          renderStatsEvents();
        }
      };

      source.onerror = () => {
        setConnectionStatus(false, "Reconnecting");
      };
    }

    renderAll();
    nodes.connectionsTab.addEventListener("click", () => showTab("connections"));
    nodes.statsTab.addEventListener("click", () => showTab("stats"));
    nodes.connectionFilterList.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-conn-id]");
      if (!button) {
        return;
      }
      state.selectedConnId = button.dataset.connId || null;
      renderConnections();
    });
    startEventStream();
  </script>
</body>
</html>
