<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iBan Model Proxy Monitor</title>
  <style>
    :root {
      --bg: #f4efe6;
      --panel: rgba(255, 251, 244, 0.88);
      --panel-strong: #fffaf0;
      --line: rgba(59, 43, 24, 0.12);
      --text: #2f2418;
      --muted: #756554;
      --accent: #a54b27;
      --accent-soft: rgba(165, 75, 39, 0.12);
      --good: #236a4b;
      --bad: #a33434;
      --shadow: 0 24px 60px rgba(74, 50, 24, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 214, 170, 0.65), transparent 34%),
        radial-gradient(circle at top right, rgba(201, 124, 68, 0.22), transparent 28%),
        linear-gradient(180deg, #fbf6ee 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 40px;
    }

    .hero {
      display: grid;
      gap: 20px;
      grid-template-columns: 1.4fr 0.9fr;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .hero-card,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .hero-card {
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      inset: auto -60px -60px auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(165, 75, 39, 0.18), transparent 70%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 10px;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 0.96;
      letter-spacing: -0.04em;
    }

    .subtext {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .status-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .status-label {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      background: rgba(35, 106, 75, 0.12);
      color: var(--good);
    }

    .status-pill.offline {
      background: rgba(163, 52, 52, 0.12);
      color: var(--bad);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.65);
    }

    .big-number {
      font-size: 54px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .muted {
      color: var(--muted);
    }

    .cards {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 24px;
    }

    .card {
      padding: 20px;
      min-height: 148px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card h2,
    .panel h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-value {
      font-size: 40px;
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 700;
      margin-top: 14px;
    }

    .card-footer {
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
    }

    .panel {
      padding: 20px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      margin-bottom: 16px;
    }

    .panel-copy {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(47, 36, 24, 0.08);
      font-size: 12px;
      font-weight: 700;
    }

    .mono {
      font-family: "SFMono-Regular", "Menlo", "Consolas", monospace;
      font-size: 12px;
    }

    .event-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 14px;
      max-height: 920px;
      overflow: auto;
    }

    .event-item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.52);
    }

    .event-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .event-title {
      font-weight: 700;
      font-size: 14px;
    }

    .event-time {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .event-body {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }

    .event-summary {
      margin-bottom: 10px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }

    .event-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      margin-bottom: 10px;
    }

    .event-detail {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(47, 36, 24, 0.04);
      border: 1px solid rgba(47, 36, 24, 0.08);
    }

    .event-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .event-value {
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .event-raw {
      margin-top: 10px;
      padding: 12px;
      border-radius: 14px;
      background: #2b2118;
      color: #f7efe3;
      font-family: "SFMono-Regular", "Menlo", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.45);
    }

    @media (max-width: 1080px) {
      .hero,
      .grid {
        grid-template-columns: 1fr;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .event-detail-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 20px 14px 28px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .hero-card,
      .panel,
      .status-card {
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="hero-card">
        <div class="eyebrow">Realtime SSE Monitor</div>
        <h1>连接监控<br>一眼看清</h1>
        <p class="subtext">
          这个页面会直接订阅 <span class="mono">/events</span>，实时更新错误、成功失败次数和 token 统计。
          页面刷新后会重新建立订阅，不依赖额外接口。
        </p>
      </div>
      <div class="hero-card status-card">
        <div class="status-row">
          <div>
            <div class="status-label">Event Stream</div>
            <div id="connectionStatus" class="status-pill offline">
              <span class="status-dot"></span>
              <span>Connecting</span>
            </div>
          </div>
          <div class="muted" id="lastEventTime">尚未收到事件</div>
        </div>
        <div>
          <div class="status-label">代理错误数</div>
          <div class="big-number" id="errorCount">0</div>
        </div>
      </div>
    </section>

    <section class="cards">
      <article class="panel card">
        <div>
          <h2>成功次数</h2>
          <div class="card-value" id="successCount">0</div>
        </div>
        <div class="card-footer">来自最新的 <span class="mono">stats_update</span></div>
      </article>
      <article class="panel card">
        <div>
          <h2>失败次数</h2>
          <div class="card-value" id="failCount">0</div>
        </div>
        <div class="card-footer">非 200 或代理内部错误都会累计</div>
      </article>
      <article class="panel card">
        <div>
          <h2>Total Tokens</h2>
          <div class="card-value" id="tokenCount">0</div>
        </div>
        <div class="card-footer">按服务端月度统计自动累计</div>
      </article>
      <article class="panel card">
        <div>
          <h2>最近事件</h2>
          <div class="card-value" id="eventCount">0</div>
        </div>
        <div class="card-footer">页面内保留最近 50 条事件</div>
      </article>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-head">
          <div>
            <h2>Recent Events</h2>
            <div class="panel-copy">展开显示关键字段、错误详情和原始请求信息，方便直接定位问题。</div>
          </div>
        </div>
        <ul id="eventList" class="event-list"></ul>
      </article>
    </section>
  </div>

  <script>
    const state = {
      events: [],
      stats: {
        successCount: 0,
        failCount: 0,
        totalTokens: 0
      },
      errorCount: 0
    };

    const nodes = {
      connectionStatus: document.getElementById("connectionStatus"),
      lastEventTime: document.getElementById("lastEventTime"),
      errorCount: document.getElementById("errorCount"),
      successCount: document.getElementById("successCount"),
      failCount: document.getElementById("failCount"),
      tokenCount: document.getElementById("tokenCount"),
      eventCount: document.getElementById("eventCount"),
      eventList: document.getElementById("eventList")
    };

    function formatTime(ts) {
      if (!ts) {
        return "-";
      }
      return new Date(ts).toLocaleString("zh-CN", {
        hour12: false
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatJson(value) {
      if (value == null) {
        return "";
      }
      return JSON.stringify(value, null, 2);
    }

    function setConnectionStatus(connected, label) {
      nodes.connectionStatus.classList.toggle("offline", !connected);
      nodes.connectionStatus.lastElementChild.textContent = label;
    }

    function pushEvent(item) {
      state.events.unshift(item);
      state.events = state.events.slice(0, 50);
      nodes.eventCount.textContent = String(state.events.length);
    }

    function updateLastEventTime(ts) {
      nodes.lastEventTime.textContent = ts ? "最近事件 " + formatTime(ts) : "尚未收到事件";
    }

    function renderStats() {
      nodes.errorCount.textContent = String(state.errorCount);
      nodes.successCount.textContent = String(state.stats.successCount);
      nodes.failCount.textContent = String(state.stats.failCount);
      nodes.tokenCount.textContent = String(state.stats.totalTokens);
    }

    function renderEventDetails(details) {
      if (!details || !details.length) {
        return "";
      }

      return `
        <div class="event-detail-grid">
          ${details.map((item) => `
            <div class="event-detail">
              <div class="event-label">${escapeHtml(item.label)}</div>
              <div class="event-value">${escapeHtml(item.value ?? "-")}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderEvents() {
      if (!state.events.length) {
        nodes.eventList.innerHTML = '<li class="empty">正在等待事件流...</li>';
        return;
      }

      nodes.eventList.innerHTML = state.events.map((item) => `
        <li class="event-item">
          <div class="event-top">
            <div class="event-title">${escapeHtml(item.title)}</div>
            <div class="event-time">${escapeHtml(formatTime(item.ts))}</div>
          </div>
          <div class="event-summary">${escapeHtml(item.summary)}</div>
          ${renderEventDetails(item.details)}
          ${item.raw ? `<pre class="event-raw">${escapeHtml(item.raw)}</pre>` : ""}
        </li>
      `).join("");
    }

    function renderAll() {
      renderStats();
      renderEvents();
    }

    function handleEvent(payload) {
      if (!payload || !payload.type) {
        return;
      }

      updateLastEventTime(payload.ts);

      if (payload.type === "conn_open") {
        pushEvent({
          title: "连接打开",
          ts: payload.ts,
          summary: `${payload.path} 收到一个新请求`,
          details: [
            { label: "Conn ID", value: payload.conn_id },
            { label: "Remote", value: payload.remote || "-" },
            { label: "Model", value: payload.request_info?.model || "-" }
          ],
          raw: formatJson(payload.request_info)
        });
      }

      if (payload.type === "conn_close") {
        pushEvent({
          title: "连接关闭",
          ts: payload.ts,
          summary: `${payload.path} 已结束`,
          details: [
            { label: "Conn ID", value: payload.conn_id },
            { label: "Remote", value: payload.remote || "-" },
            { label: "Status", value: payload.status },
            { label: "Cost", value: `${payload.cost_ms}ms` }
          ]
        });
      }

      if (payload.type === "stats_update") {
        state.stats.successCount = payload.success_count ?? 0;
        state.stats.failCount = payload.fail_count ?? 0;
        state.stats.totalTokens = payload.total_tokens ?? 0;
        pushEvent({
          title: "统计更新",
          ts: payload.ts,
          summary: "服务端统计数据已刷新",
          details: [
            { label: "Success", value: state.stats.successCount },
            { label: "Fail", value: state.stats.failCount },
            { label: "Tokens", value: state.stats.totalTokens }
          ]
        });
      }

      if (payload.type === "proxy_error") {
        state.errorCount += 1;
        pushEvent({
          title: "代理错误",
          ts: payload.ts,
          summary: payload.error,
          details: [
            { label: "Conn ID", value: payload.conn_id },
            { label: "Path", value: payload.path },
            { label: "Stage", value: payload.stage },
            { label: "Status", value: payload.status },
            { label: "Upstream", value: payload.upstream_path }
          ]
        });
      }

      renderAll();
    }

    function startEventStream() {
      setConnectionStatus(false, "Connecting");
      const source = new EventSource("/events");

      source.onopen = () => {
        setConnectionStatus(true, "Connected");
      };

      source.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          handleEvent(payload);
        } catch (error) {
          pushEvent({
            title: "解析失败",
            ts: Date.now(),
            summary: "收到了一条无法解析的事件数据",
            details: [
              { label: "Reason", value: error.message || "Unknown parse error" }
            ]
          });
          renderEvents();
        }
      };

      source.onerror = () => {
        setConnectionStatus(false, "Reconnecting");
      };
    }

    renderAll();
    startEventStream();
  </script>
</body>
</html>
